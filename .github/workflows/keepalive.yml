name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days of no repository
# activity. This repo is dormant, so this job makes a tiny empty commit once a
# month to reset that timer and keep "Siigo daily sync" running indefinitely.
on:
  schedule:
    - cron: "0 12 1 * *" # 12:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (prevent scheduled workflow auto-disable)"
          git push
