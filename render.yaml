services:
  - type: web
    name: intexa-arca-api
    runtime: go
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SIIGO_USERNAME
        sync: false
      - key: SIIGO_ACCESS_KEY
        sync: false
      - key: SIIGO_PARTNER_ID
        sync: false
